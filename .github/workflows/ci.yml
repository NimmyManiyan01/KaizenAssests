name: Kaizen WMS Continuous Integration (CI)

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend Lint, Compile & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/business-service

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/business-service/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio aiosqlite
          pip install -r requirements.txt

      - name: Python Static Compilation Check
        run: |
          python -m compileall app/

      - name: Ruff Linting Check
        run: |
          ruff check app/

      - name: Run Backend Unit Tests
        run: |
          pytest -v --maxfail=5

  frontend-ci:
    name: Frontend Lint, Typecheck & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          npm ci

      - name: ESLint Code Quality Check
        run: |
          npm run lint --if-present

      - name: Frontend Vitest Unit Tests
        run: |
          npm run test --if-present

  docker-dry-run:
    name: Dockerfile Build Validation
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Backend Docker Build
        uses: docker/build-push-action@v6
        with:
          context: backend/business-service
          file: backend/business-service/Dockerfile
          push: false
          tags: kaizen-backend:test-dry-run

      - name: Validate Frontend Docker Build
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          tags: kaizen-frontend:test-dry-run
          build-args: |
            VITE_BUSINESS_API_URL=https://kaizen-wms-backend.graybeach-6b6c99c3.centralindia.azurecontainerapps.io
